<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Super Mario 64</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='cap'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff5a4d'/%3E%3Cstop%20offset='1'%20stop-color='%23d81f16'/%3E%3C/linearGradient%3E%3ClinearGradient%20id='stem'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ffeccb'/%3E%3Cstop%20offset='1'%20stop-color='%23f2d09a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20fill='url(%23stem)'%20d='M20%2033h24v13a12%2012%200%200%201-24%200z'/%3E%3Cellipse%20cx='27.5'%20cy='44'%20rx='2'%20ry='3.4'%20fill='%233a2a1a'/%3E%3Cellipse%20cx='36.5'%20cy='44'%20rx='2'%20ry='3.4'%20fill='%233a2a1a'/%3E%3Cpath%20fill='url(%23cap)'%20d='M32%206C18%206%206%2015.5%206%2029c0%204%202.8%206.5%207%206.5h38c4.2%200%207-2.5%207-6.5C58%2015.5%2046%206%2032%206z'/%3E%3Ccircle%20cx='32'%20cy='17'%20r='6.2'%20fill='%23fff'/%3E%3Ccircle%20cx='15.5'%20cy='28'%20r='4.2'%20fill='%23fff'/%3E%3Ccircle%20cx='48.5'%20cy='28'%20r='4.2'%20fill='%23fff'/%3E%3Ccircle%20cx='23'%20cy='14.5'%20r='2.4'%20fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --bar-h: 36px; }
  html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #ddd; }

  /* 메뉴바 + 게임을 한 래퍼로 묶어 이 래퍼째로 풀스크린 → 풀스크린에서도 메뉴 유지 */
  /* 모바일: 100vh 는 주소창 영역까지라 하단이 잘림 → 100dvh(동적 뷰포트)로 실제 보이는 높이에 맞춤 */
  #wrapper { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ── 상단 메뉴바 (항상 표시, 풀스크린에서도) ── */
  #menubar {
    flex: 0 0 var(--bar-h); height: var(--bar-h);
    display: flex; align-items: stretch;
    background: #1e1e22; border-bottom: 1px solid #333;
    user-select: none; z-index: 100; position: relative;
    /* overflow:hidden 넣으면 드롭다운(아래로 펼쳐짐)이 잘려서 안 됨 → 브랜드 축소로만 넘침 방지 */
  }
  #menubar .brand { display: flex; align-items: center; padding: 0 12px; font-weight: 600;
                    font-size: 13px; color: #e8b923; letter-spacing: .3px;
                    flex: 0 1 auto; min-width: 0; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
  .menu > .menu-title { flex: 0 0 auto; white-space: nowrap; }
  /* 아주 좁은 화면: 브랜드 텍스트 숨기고 🍄 만 (메뉴 공간 확보) */
  @media (max-width: 520px) {
    #menubar .brand { font-size: 0; padding: 0 8px; }
    #menubar .brand::before { content: "🍄"; font-size: 15px; }
  }
  .menu { position: relative; }
  .menu > .menu-title {
    height: 100%; padding: 0 14px; background: none; border: 0; color: #ddd;
    font-size: 13px; cursor: pointer;
  }
  .menu > .menu-title:hover, .menu.open > .menu-title { background: #2c2c33; }
  .menu-drop {
    display: none; position: absolute; top: var(--bar-h); left: 0; min-width: 180px;
    background: #26262b; border: 1px solid #3a3a42; border-top: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); padding: 4px 0; z-index: 101;
  }
  .menu.open .menu-drop { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .menu-item:hover { background: #34343c; }
  .menu-item input { margin: 0; }

  /* ── 게임 스테이지 ── */
  /* 게임은 가운데 — 상단 버튼류와 하단 스틱이 위아래로 감싸는 배치 */
  #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
           overflow: hidden; background: #000; position: relative; }
  canvas.emscripten {
    display: block; border: 0; background: #000; outline: none;
    image-rendering: pixelated;
    /* 4:3 유지하며 가로·세로 둘 다 안 넘치게 "contain".
       너비 = min(가로 100%, 세로제한을 4:3로 환산한 폭) → 세로긴 화면서도 폭이 안 넘침(양옆 안잘림).
       (88dvh = 66dvh×4/3, 640px = 480px×4/3) */
    width: min(100%, 88dvh, 640px);
    height: auto;
    aspect-ratio: 4 / 3;
    min-width: 0;
  }
  /* 풀스크린: 래퍼가 전체화면일 때 캔버스를 스테이지(메뉴바 제외 영역)에 꽉 채움 */
  #wrapper:fullscreen canvas.emscripten,
  #wrapper:-webkit-full-screen canvas.emscripten {
    height: calc(100vh - var(--bar-h)); width: auto; max-width: 100vw;
  }
  #wrapper:fullscreen, #wrapper:-webkit-full-screen { background: #000; }

  #loading { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; color: #bbb; font-size: 14px; background: #000; z-index: 10; }

  /* ── 온스크린 게임패드 (터치/마우스) ── */
  #gamepad { position: absolute; inset: 0; z-index: 40; pointer-events: none;
             touch-action: none; -webkit-user-select: none; user-select: none; }
  #gamepad .pad-btn, #gamepad #stick {
    position: absolute; pointer-events: auto; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gamepad .pad-btn {
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,.6); border-radius: 50%;
    color: #fff; font-weight: 800; font-size: clamp(12px, 2.6vmin, 20px);
    background: rgba(60,60,68,.5); opacity: .9; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.7); line-height: 1;
    /* 버튼엔 transform·transition 을 아예 안 둔다(→ 안 움직임). 네이티브 드래그/선택만 차단. */
    -webkit-touch-callout: none; -webkit-user-drag: none; user-drag: none; user-select: none;
  }
  /* 눌림 = 밝아지고 살짝 눌림(scale). transition 없음 → 슬라이딩 아니라 즉시 반응.
     (버튼은 이제 translate(-50%) 로 중앙정렬 안 하므로 scale 이 위치와 안 충돌) */
  #gamepad .pad-btn.pressed { filter: brightness(1.7); transform: scale(0.9); }
  /* ── 배치(모바일, N64 참고) ── 상단: 십자키(좌)·Z|START|R(중앙)·A/B/C(우) / 하단 좌: 스틱
     버튼류는 위, 스틱은 아래. 반투명으로 게임 위에 겹침. */
  /* 십자키(D-pad): 상단 왼쪽 — 디지털 이동(스틱과 같은 __vstick 훅) */
  #dpad { position: absolute; left: 3%; top: 8%;
          width: clamp(108px,27vmin,176px); height: clamp(108px,27vmin,176px); pointer-events: none; }
  .d-btn { width: 34%; height: 34%; background: rgba(74,78,88,.85); color: #d5d8de; }
  .d-up    { left: 33%; top: 0; }
  .d-down  { left: 33%; bottom: 0; }
  .d-left  { left: 0;   top: 33%; }
  .d-right { right: 0;  top: 33%; }
  /* A/B/C 페이스 묶음(N64 배열): 상단 오른쪽. A(파랑,큰버튼) 아래, B(초록) 좌상, C(노랑 다이아) 우상 */
  #pad-face { position: absolute; right: 2%; top: 5%;
              width: clamp(176px, 43vmin, 300px); height: clamp(176px, 43vmin, 300px);
              pointer-events: none; }
  .a-btn { width: 40%; height: 40%; right: 5%;  bottom: 3%; background: rgba(38,104,214,.85); }
  .b-btn { width: 30%; height: 30%; left: 1%;   top: 8%;   background: rgba(52,168,74,.85); }
  .c-cluster { position: absolute; top: 0; right: 0; width: 50%; height: 50%; pointer-events: none; }
  .c-btn { width: 36%; height: 36%; background: rgba(242,194,0,.9); color: #3a2c00; font-weight: 800; }
  .c-up    { left: 32%; top: 0; }
  .c-down  { left: 32%; bottom: 0; }
  .c-left  { left: 0;   top: 32%; }
  .c-right { right: 0;  top: 32%; }
  /* 상단 중앙 트레이: Z | START | R */
  .center-tray { position: absolute; left: 0; right: 0; top: 6%; display: flex;
                 justify-content: center; align-items: center; gap: 3vmin; pointer-events: none; }
  #gamepad .center-tray .pad-btn { position: static; }
  .z-btn { width: clamp(44px,10.5vmin,72px); height: clamp(44px,10.5vmin,72px); background: rgba(120,124,134,.85); }
  .start-btn { width: clamp(56px,13vmin,90px); height: clamp(38px,9vmin,58px);
               border-radius: 999px; background: rgba(206,54,54,.88); }
  .r-btn { width: clamp(44px,10.5vmin,72px); height: clamp(44px,10.5vmin,72px); background: rgba(120,124,134,.85); }
  /* 하단 왼쪽: 아날로그 스틱 */
  #stick { left: 5%; bottom: 6%; width: clamp(140px,36vmin,240px); height: clamp(140px,36vmin,240px);
           border-radius: 50%; background: radial-gradient(circle, rgba(80,80,90,.42), rgba(30,30,36,.5));
           border: 2px solid rgba(255,255,255,.4); opacity: .82; }
  #stick-knob { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%;
                margin: -22% 0 0 -22%; border-radius: 50%;
                background: radial-gradient(circle at 40% 35%, #cfd3da, #6a6e78);
                border: 2px solid rgba(255,255,255,.5); pointer-events: none; }
  #stick-label { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 color: rgba(255,255,255,.35); font-size: clamp(9px,1.8vmin,13px);
                 pointer-events: none; font-weight: 700; }

  /* 하단 조작 안내 바 */
  #controls { flex: 0 0 auto; padding: 5px 10px; background: #1a1a1f; border-top: 1px solid #333;
              color: #9aa4ad; font-size: 11px; text-align: center; white-space: nowrap;
              overflow-x: auto; }
  #controls b { color: #e8b923; font-weight: 600; }
</style>
</head>
<body>
<div id="wrapper">
  <div id="menubar">
    <span class="brand">🍄 Super Mario 64</span>
    <div class="menu" id="menu-screen">
      <button class="menu-title" type="button">화면 ▾</button>
      <div class="menu-drop">
        <label class="menu-item"><input type="checkbox" id="fs-toggle"> 풀스크린</label>
      </div>
    </div>
    <div class="menu" id="menu-lang">
      <button class="menu-title" type="button">언어 ▾</button>
      <div class="menu-drop">
        <a class="menu-item" href="/" data-lang="en">English</a>
        <a class="menu-item" href="/kr/" data-lang="kr">한국어</a>
      </div>
    </div>
    <div class="menu" id="menu-settings">
      <button class="menu-title" type="button">⚙ 설정 ▾</button>
      <div class="menu-drop">
        <label class="menu-item"><input type="checkbox" id="pad-toggle"> 가상 게임패드</label>
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="loading">로딩 중…</div>
    <canvas class="emscripten" id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <!-- 온스크린 게임패드: window 에 합성 KeyboardEvent(code) 를 보내 기존 키 입력 경로를 그대로 탄다 -->
    <div id="gamepad" aria-hidden="true">
      <div id="stick"><div id="stick-knob"></div><span id="stick-label">이동</span></div>
      <!-- 십자키 (상단 좌측, 디지털 이동) -->
      <div id="dpad">
        <button class="pad-btn d-btn d-up"    type="button" data-dir="up">▲</button>
        <button class="pad-btn d-btn d-left"  type="button" data-dir="left">◀</button>
        <button class="pad-btn d-btn d-right" type="button" data-dir="right">▶</button>
        <button class="pad-btn d-btn d-down"  type="button" data-dir="down">▼</button>
      </div>
      <!-- 우측 페이스버튼 묶음 (N64 배열) -->
      <div id="pad-face">
        <div class="c-cluster">
          <button class="pad-btn c-btn c-up"    type="button" data-code="ArrowUp">C▲</button>
          <button class="pad-btn c-btn c-left"  type="button" data-code="ArrowLeft">C◀</button>
          <button class="pad-btn c-btn c-right" type="button" data-code="ArrowRight">C▶</button>
          <button class="pad-btn c-btn c-down"  type="button" data-code="ArrowDown">C▼</button>
        </div>
        <button class="pad-btn b-btn" type="button" data-code="Comma">B</button>
        <button class="pad-btn a-btn" type="button" data-code="KeyL">A</button>
      </div>
      <div class="center-tray">
        <button class="pad-btn z-btn"     type="button" data-code="KeyK">Z</button>
        <button class="pad-btn start-btn" type="button" data-code="Space">START</button>
        <button class="pad-btn r-btn"     type="button" data-code="ShiftRight">R</button>
      </div>
    </div>
  </div>
  <div id="controls">
    이동 <b>W A S D</b> · 카메라 <b>방향키</b> · 점프 <b>L</b> · 펀치/잡기 <b>,</b> · 웅크리기 <b>K</b> · 시작/일시정지 <b>Space</b> · R <b>우측 Shift</b>
  </div>
</div>

<script type="text/javascript">
  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      c.addEventListener('webglcontextlost', function (e) {
        console.error('[shell] WebGL context lost'); e.preventDefault();
      }, false);
      return c;
    })(),
    print: function () { console.log.apply(console, arguments); },
    printErr: function () { console.error.apply(console, arguments); },
    setStatus: function (t) { if (t) console.log('[status] ' + t); },
    onRuntimeInitialized: function () {
      var el = document.getElementById('loading'); if (el) el.remove();
      focusCanvas();
    },
    monitorRunDependencies: function () {}
  };
  window.onerror = function (msg) { console.error('[shell] onerror:', msg); };

  function focusCanvas() { try { Module.canvas.focus(); } catch (e) {} }

  // ── 드롭다운 메뉴 열고 닫기 (여러 메뉴 지원) ──
  var menuScreen = document.getElementById('menu-screen');
  var menus = Array.prototype.slice.call(document.querySelectorAll('#menubar .menu'));
  menus.forEach(function (m) {
    m.querySelector('.menu-title').addEventListener('click', function (e) {
      e.stopPropagation();
      var wasOpen = m.classList.contains('open');
      menus.forEach(function (x) { x.classList.remove('open'); });
      if (!wasOpen) m.classList.add('open');
    });
    var drop = m.querySelector('.menu-drop');
    if (drop) drop.addEventListener('click', function (e) { e.stopPropagation(); });
  });
  document.addEventListener('click', function () { menus.forEach(function (x) { x.classList.remove('open'); }); });

  // 현재 언어 표시(✓) — 경로가 /kr 로 시작하면 한국어
  var isKr = location.pathname.indexOf('/kr') === 0;
  document.querySelectorAll('#menu-lang .menu-item').forEach(function (a) {
    if ((a.getAttribute('data-lang') === 'kr') === isKr) { a.textContent = '✓ ' + a.textContent; }
  });

  // ── 풀스크린 토글 (래퍼째 전체화면 → 메뉴바 유지) ──
  var wrapper = document.getElementById('wrapper');
  var fsToggle = document.getElementById('fs-toggle');
  function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function enterFs() {
    if (wrapper.requestFullscreen) return wrapper.requestFullscreen();
    if (wrapper.webkitRequestFullscreen) return wrapper.webkitRequestFullscreen();
  }
  function exitFs() {
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  }
  fsToggle.addEventListener('change', function () {
    if (fsToggle.checked) { try { enterFs(); } catch (e) {} }
    else { try { exitFs(); } catch (e) {} }
    menuScreen.classList.remove('open');
    setTimeout(focusCanvas, 50);
  });
  // Esc 등으로 상태가 바뀌면 체크박스 동기화
  function onFsChange() { fsToggle.checked = !!isFs(); setTimeout(focusCanvas, 50); }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  // 게임 영역 클릭 시 캔버스 포커스(키 입력 보장)
  document.getElementById('stage').addEventListener('click', focusCanvas);

  // ══ 온스크린 게임패드 ══
  // 게임은 controller_emscripten_keyboard.c 에서 window 의 keydown/keyup 을 받아
  // KeyboardEvent.code → DIK 스캔코드로 변환한다. 그래서 정확한 code 로 합성 이벤트를 쏘면 된다.
  (function () {
    var codeToKey = { KeyW:'w', KeyA:'a', KeyS:'s', KeyD:'d', KeyL:'l', KeyK:'k',
      Comma:',', Space:' ', ShiftRight:'Shift',
      ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight' };
    var codeToKeyCode = { KeyW:87, KeyA:65, KeyS:83, KeyD:68, KeyL:76, KeyK:75,
      Comma:188, Space:32, ShiftRight:16, ArrowUp:38, ArrowDown:40, ArrowLeft:37, ArrowRight:39 };

    function sendKey(code, down) {
      var kc = codeToKeyCode[code] || 0;
      var ev = new KeyboardEvent(down ? 'keydown' : 'keyup', {
        code: code, key: codeToKey[code] || code, keyCode: kc, which: kc,
        location: (code === 'ShiftRight') ? 2 : 0, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ev);
    }

    // ── 일반 버튼 (A/B/Z/R/START/C) — data-code 있는 것만 (십자키는 data-dir 이라 제외) ──
    var padBtns = Array.prototype.slice.call(document.querySelectorAll('#gamepad .pad-btn[data-code]'));
    padBtns.forEach(function (btn) {
      var code = btn.getAttribute('data-code');
      btn._down = false;
      function press(e) {
        e.preventDefault();
        if (btn._down) return;
        btn._down = true; btn.classList.add('pressed');
        try { btn.setPointerCapture(e.pointerId); } catch (x) {}
        sendKey(code, true);
      }
      function release(e) {
        if (e) e.preventDefault();
        if (!btn._down) return;
        btn._down = false; btn.classList.remove('pressed');
        sendKey(code, false);
      }
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      btn._release = release;
    });

    // ── 아날로그 스틱 (진짜 아날로그) ──
    // 노브를 민 방향·거리를 실제 N64 스틱값(-128..127)으로 window.__vstickX/Y 에 넣는다.
    // C(controller_keyboard.c)가 매 프레임 이 값을 읽어 pad->stick_x/y 로 주입 → 밀은 만큼 속도 조절.
    var stick = document.getElementById('stick');
    var knob = document.getElementById('stick-knob');
    var stickPointer = null;
    window.__vstickX = 0; window.__vstickY = 0;

    function releaseStick() {
      window.__vstickX = 0; window.__vstickY = 0;
      knob.style.transform = '';
    }
    function updateStick(x, y) {
      var r = stick.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = x - cx, dy = y - cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var maxK = r.width * 0.40, dead = r.width * 0.10;   // 넓은 스로우 + 작은 데드존
      var kx = dx, ky = dy;
      if (dist > maxK) { kx = dx / dist * maxK; ky = dy / dist * maxK; }
      knob.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';
      if (dist < dead) { window.__vstickX = 0; window.__vstickY = 0; return; }
      // ★미세조정 핵심★ SM64는 raw 스틱을 데드존8 처리 + stickMag를 64로 클램프한다.
      // 즉 raw 약 8~72 만 유효(그 위는 전부 최대속도). 그래서 throw 전체를 그 범위로 매핑하고,
      // expo 곡선으로 저속(걷기) 구간을 넓혀 살짝 밀면 천천히, 끝까지 밀면 달리게 한다.
      // 대각선도 축당 8을 넘도록 하한을 12로(=45°에서 축값 8.5) → 저속 대각 이동 보장.
      var t = (Math.min(dist, maxK) - dead) / (maxK - dead); // 0..1
      var mag = 12 + Math.pow(t, 1.6) * 60;                  // raw 12..72
      var ux = dx / dist, uy = dy / dist;
      var sx = Math.round(ux * mag);
      var sy = Math.round(-uy * mag);                        // 화면 y 아래로+, N64 위가+
      window.__vstickX = sx < -128 ? -128 : sx > 127 ? 127 : sx;
      window.__vstickY = sy < -128 ? -128 : sy > 127 ? 127 : sy;
    }
    stick.addEventListener('pointerdown', function (e) {
      e.preventDefault(); stickPointer = e.pointerId;
      try { stick.setPointerCapture(e.pointerId); } catch (x) {}
      updateStick(e.clientX, e.clientY);
    });
    stick.addEventListener('pointermove', function (e) {
      if (e.pointerId !== stickPointer) return;
      e.preventDefault(); updateStick(e.clientX, e.clientY);
    });
    function endStick(e) {
      if (e.pointerId !== stickPointer) return;
      stickPointer = null; releaseStick();
    }
    stick.addEventListener('pointerup', endStick);
    stick.addEventListener('pointercancel', endStick);
    stick.addEventListener('lostpointercapture', endStick);

    // ── 십자키 (디지털 이동 — 스틱과 같은 __vstick 훅. 상단 좌측) ──
    var DPAD_V = 72;  // raw 스틱값(달리기 최대). 게임이 magnitude 를 64 로 클램프.
    var dpadState = { up: false, down: false, left: false, right: false };
    function applyDpad() {
      window.__vstickX = (dpadState.right ? DPAD_V : 0) + (dpadState.left ? -DPAD_V : 0);
      window.__vstickY = (dpadState.up ? DPAD_V : 0) + (dpadState.down ? -DPAD_V : 0);
    }
    var dpadBtns = Array.prototype.slice.call(document.querySelectorAll('#dpad .pad-btn'));
    dpadBtns.forEach(function (btn) {
      var dir = btn.getAttribute('data-dir');
      btn._down = false;
      function press(e) {
        e.preventDefault(); if (btn._down) return;
        btn._down = true; btn.classList.add('pressed');
        try { btn.setPointerCapture(e.pointerId); } catch (x) {}
        dpadState[dir] = true; applyDpad();
      }
      function release(e) {
        if (e) e.preventDefault(); if (!btn._down) return;
        btn._down = false; btn.classList.remove('pressed');
        dpadState[dir] = false; applyDpad();
      }
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      btn._release = release;
    });

    // ── 전체 해제 (토글 off / 탭 비활성 / 포커스 상실) ──
    function releaseAll() {
      releaseStick();
      padBtns.forEach(function (b) { if (b._down) b._release(); });
      dpadBtns.forEach(function (b) { if (b._down) b._release(); });
    }
    document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });
    window.addEventListener('blur', releaseAll);

    // ── 설정(⚙) 토글 + localStorage 유지 ──
    var gamepad = document.getElementById('gamepad');
    var padToggle = document.getElementById('pad-toggle');
    var menuSettings = document.getElementById('menu-settings');
    function setPad(on) {
      gamepad.style.display = on ? 'block' : 'none';
      padToggle.checked = on;
      try { localStorage.setItem('sm64_vpad', on ? '1' : '0'); } catch (x) {}
      if (!on) releaseAll();
    }
    padToggle.addEventListener('change', function () {
      setPad(padToggle.checked);
      if (menuSettings) menuSettings.classList.remove('open');
      setTimeout(focusCanvas, 50);
    });
    var saved = null;
    try { saved = localStorage.getItem('sm64_vpad'); } catch (x) {}
    setPad(saved === null ? true : saved === '1'); // 기본값: 표시
  })();
</script>
