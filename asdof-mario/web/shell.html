<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Super Mario 64</title>
<style>
  :root { --bar-h: 36px; }
  html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #ddd; }

  /* 메뉴바 + 게임을 한 래퍼로 묶어 이 래퍼째로 풀스크린 → 풀스크린에서도 메뉴 유지 */
  #wrapper { display: flex; flex-direction: column; height: 100vh; }

  /* ── 상단 메뉴바 (항상 표시, 풀스크린에서도) ── */
  #menubar {
    flex: 0 0 var(--bar-h); height: var(--bar-h);
    display: flex; align-items: stretch;
    background: #1e1e22; border-bottom: 1px solid #333;
    user-select: none; z-index: 100; position: relative;
  }
  #menubar .brand { display: flex; align-items: center; padding: 0 12px; font-weight: 600;
                    font-size: 13px; color: #e8b923; letter-spacing: .3px; }
  .menu { position: relative; }
  .menu > .menu-title {
    height: 100%; padding: 0 14px; background: none; border: 0; color: #ddd;
    font-size: 13px; cursor: pointer;
  }
  .menu > .menu-title:hover, .menu.open > .menu-title { background: #2c2c33; }
  .menu-drop {
    display: none; position: absolute; top: var(--bar-h); left: 0; min-width: 180px;
    background: #26262b; border: 1px solid #3a3a42; border-top: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); padding: 4px 0; z-index: 101;
  }
  .menu.open .menu-drop { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .menu-item:hover { background: #34343c; }
  .menu-item input { margin: 0; }

  /* ── 게임 스테이지 ── */
  #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
           overflow: hidden; background: #000; }
  canvas.emscripten {
    display: block; border: 0; background: #000; outline: none;
    image-rendering: pixelated;
    /* 기본(창 모드): 화면 높이의 일부만 쓰는 작은 창, 4:3 유지 */
    height: min(66vh, 480px); width: auto; aspect-ratio: 4 / 3;
    max-width: 100%;
  }
  /* 풀스크린: 래퍼가 전체화면일 때 캔버스를 스테이지(메뉴바 제외 영역)에 꽉 채움 */
  #wrapper:fullscreen canvas.emscripten,
  #wrapper:-webkit-full-screen canvas.emscripten {
    height: calc(100vh - var(--bar-h)); width: auto; max-width: 100vw;
  }
  #wrapper:fullscreen, #wrapper:-webkit-full-screen { background: #000; }

  #loading { position: absolute; inset: var(--bar-h) 0 0 0; display: flex; align-items: center;
             justify-content: center; color: #bbb; font-size: 14px; background: #000; z-index: 10; }
</style>
</head>
<body>
<div id="wrapper">
  <div id="menubar">
    <span class="brand">🍄 Super Mario 64</span>
    <div class="menu" id="menu-screen">
      <button class="menu-title" type="button">화면 ▾</button>
      <div class="menu-drop">
        <label class="menu-item"><input type="checkbox" id="fs-toggle"> 풀스크린</label>
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="loading">로딩 중…</div>
    <canvas class="emscripten" id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  </div>
</div>

<script type="text/javascript">
  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      c.addEventListener('webglcontextlost', function (e) {
        console.error('[shell] WebGL context lost'); e.preventDefault();
      }, false);
      return c;
    })(),
    print: function () { console.log.apply(console, arguments); },
    printErr: function () { console.error.apply(console, arguments); },
    setStatus: function (t) { if (t) console.log('[status] ' + t); },
    onRuntimeInitialized: function () {
      var el = document.getElementById('loading'); if (el) el.remove();
      focusCanvas();
    },
    monitorRunDependencies: function () {}
  };
  window.onerror = function (msg) { console.error('[shell] onerror:', msg); };

  function focusCanvas() { try { Module.canvas.focus(); } catch (e) {} }

  // ── 드롭다운 메뉴 열고 닫기 ──
  var menuScreen = document.getElementById('menu-screen');
  menuScreen.querySelector('.menu-title').addEventListener('click', function (e) {
    e.stopPropagation();
    menuScreen.classList.toggle('open');
  });
  document.addEventListener('click', function () { menuScreen.classList.remove('open'); });
  menuScreen.querySelector('.menu-drop').addEventListener('click', function (e) { e.stopPropagation(); });

  // ── 풀스크린 토글 (래퍼째 전체화면 → 메뉴바 유지) ──
  var wrapper = document.getElementById('wrapper');
  var fsToggle = document.getElementById('fs-toggle');
  function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function enterFs() {
    if (wrapper.requestFullscreen) return wrapper.requestFullscreen();
    if (wrapper.webkitRequestFullscreen) return wrapper.webkitRequestFullscreen();
  }
  function exitFs() {
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  }
  fsToggle.addEventListener('change', function () {
    if (fsToggle.checked) { try { enterFs(); } catch (e) {} }
    else { try { exitFs(); } catch (e) {} }
    menuScreen.classList.remove('open');
    setTimeout(focusCanvas, 50);
  });
  // Esc 등으로 상태가 바뀌면 체크박스 동기화
  function onFsChange() { fsToggle.checked = !!isFs(); setTimeout(focusCanvas, 50); }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  // 게임 영역 클릭 시 캔버스 포커스(키 입력 보장)
  document.getElementById('stage').addEventListener('click', focusCanvas);
</script>

{{{ SCRIPT }}}
</body>
</html>
