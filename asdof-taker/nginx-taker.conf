# asdof-taker — nginx vhost (taker.asdof.xyz)
#
# 앱(systemd: asdof-taker)이 127.0.0.1:8780 에서 관리 UI 와 API 를 모두 서빙하므로
# nginx 는 단순 프록시만 하면 된다. WebSocket 은 쓰지 않는다(폴링).
#
# 배치:
#   sudo cp nginx-taker.conf /etc/nginx/sites-available/taker.conf
#   sudo ln -s /etc/nginx/sites-available/taker.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d taker.asdof.xyz      # 443/TLS 는 certbot 이 추가
#
# 전제: DNS 에 taker.asdof.xyz A레코드가 서버(161.118.133.112)를 가리켜야 함.

server {
    listen 80;
    listen [::]:80;
    server_name taker.asdof.xyz;

    # 관리 페이지다 — 검색엔진에 올라갈 이유가 없다.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 앱이 세션 쿠키에 Secure 를 붙일지 판단하는 근거
        proxy_set_header X-Forwarded-Proto $scheme;

        # 조회·로그인 테스트는 외부 사이트를 왕복하므로 여유를 둔다
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
