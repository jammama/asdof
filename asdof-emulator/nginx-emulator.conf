# asdof-emulator — nginx vhost (emulator.asdof.xyz)
#
# 핵심: mGBA wasm 코어가 스레드(SharedArrayBuffer)를 쓰므로 cross-origin isolation
#       (COOP/COEP) 헤더가 반드시 있어야 한다. 없으면 코어가 뜨지 않는다.
#
# 배치:  /etc/nginx/sites-available/emulator.conf  →  sites-enabled 로 심볼릭 링크
#        sudo nginx -t && sudo systemctl reload nginx
# TLS:   sudo certbot --nginx -d emulator.asdof.xyz   (mario 서브도메인과 동일 방식)
#
# 참고: 최신 nginx mime.types 에는 이미 'application/wasm wasm;' 이 있다.
#       없으면 아래 types 블록의 주석을 해제하거나 mime.types 에 추가할 것.

server {
    listen 80;
    listen [::]:80;
    server_name emulator.asdof.xyz;

    root /var/www/emulator;
    index index.html;

    # cross-origin isolation — 모든 응답에 부여
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # types {
    #     application/wasm wasm;
    # }

    location / {
        try_files $uri $uri/ =404;
    }

    # 코어(wasm/js)는 내용이 안 바뀌므로 길게 캐시
    location /core/ {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 롬은 매니페스트 갱신을 바로 반영
    location = /roms/roms.json {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache";
    }

    # 서버 세이브 API → save-server (systemd: asdof-save-server, 127.0.0.1:8760)
    # 같은 오리진이라 CORS 불필요. isolation 헤더는 location 에서 다시 명시(상속 안 됨).
    location /api/ {
        proxy_pass http://127.0.0.1:8760;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16m;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
