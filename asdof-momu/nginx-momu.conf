# asdof-momu — nginx vhost (momu.asdof.xyz)
#
# 앱(systemd: asdof-momu)이 127.0.0.1:8790 에서 정적 파일과 JSON API 를 모두 서빙하므로
# nginx 는 단순 리버스 프록시만 하면 된다.
#
# 배치:
#   sudo cp nginx-momu.conf /etc/nginx/sites-available/momu.conf
#   sudo ln -s /etc/nginx/sites-available/momu.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d momu.asdof.xyz     # 443/TLS 는 certbot 이 추가
#
# 전제: DNS 에 momu.asdof.xyz A레코드가 서버(161.118.133.112)를 가리켜야 함.

server {
    listen 80;
    listen [::]:80;
    server_name momu.asdof.xyz;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
