# asdof-saves — nginx vhost (saves.asdof.xyz)
#
# 서비스 자체가 CORS 를 처리하므로 nginx 는 단순 프록시만 한다(헤더 중복 금지).
# save-server(systemd: asdof-saves)는 127.0.0.1:8760 로만 listen → 외부 포트 개방 불필요.
#
# 배치:
#   sudo cp nginx-saves.conf /etc/nginx/sites-available/saves.conf
#   sudo ln -s /etc/nginx/sites-available/saves.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d saves.asdof.xyz     # 443/TLS 는 certbot 이 추가
#
# 전제: DNS 에 saves.asdof.xyz A레코드가 서버(161.118.133.112)를 가리켜야 함.

server {
    listen 80;
    listen [::]:80;
    server_name saves.asdof.xyz;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8760;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
