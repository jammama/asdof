<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>3D Pinball – Space Cadet (Web)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3CradialGradient%20id='space'%20cx='34%25'%20cy='28%25'%20r='85%25'%3E%3Cstop%20offset='0'%20stop-color='%232a3c72'/%3E%3Cstop%20offset='1'%20stop-color='%230a0d18'/%3E%3C/radialGradient%3E%3CradialGradient%20id='ball'%20cx='36%25'%20cy='32%25'%20r='72%25'%3E%3Cstop%20offset='0'%20stop-color='%23ffffff'/%3E%3Cstop%20offset='0.42'%20stop-color='%23d9dee8'/%3E%3Cstop%20offset='1'%20stop-color='%235f6472'/%3E%3C/radialGradient%3E%3ClinearGradient%20id='flip'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%235aa6ff'/%3E%3Cstop%20offset='1'%20stop-color='%232b6fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='15'%20fill='url(%23space)'/%3E%3Ccircle%20cx='13'%20cy='15'%20r='1.3'%20fill='%23bcd8ff'/%3E%3Ccircle%20cx='52'%20cy='20'%20r='1'%20fill='%23e6f1ff'/%3E%3Ccircle%20cx='15'%20cy='38'%20r='1'%20fill='%238ab4ff'%20opacity='0.8'/%3E%3Cpath%20fill='%238ad0ff'%20d='M47%209l1.5%204%204%201.5-4%201.5-1.5%204-1.5-4-4-1.5%204-1.5z'/%3E%3Crect%20x='14'%20y='45.5'%20width='20'%20height='6.5'%20rx='3.25'%20fill='url(%23flip)'%20transform='rotate(20%2014%2048.75)'/%3E%3Crect%20x='30'%20y='45.5'%20width='20'%20height='6.5'%20rx='3.25'%20fill='url(%23flip)'%20transform='rotate(-20%2050%2048.75)'/%3E%3Ccircle%20cx='32'%20cy='30'%20r='13.5'%20fill='url(%23ball)'/%3E%3Cellipse%20cx='26.5'%20cy='24'%20rx='4'%20ry='2.6'%20fill='%23ffffff'%20opacity='0.85'/%3E%3C/svg%3E">
    <style>
        :root { color-scheme: dark; --ctrl-h: 152px; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: #101014; color: #d0d0d8; overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #app {
            position: fixed; inset: 0; bottom: var(--ctrl-h);
            display: flex; align-items: center; justify-content: center;
        }
        /* SDL renders here. Nearest-neighbour keeps the pixel-art crisp when scaled. */
        canvas#canvas {
            display: block;
            max-width: 100%; max-height: 100%;
            background: #000; outline: none;
            image-rendering: pixelated; image-rendering: crisp-edges;
        }

        /* ── 진입 화면 (로딩 → 닉네임/방 입력 폼) ── */
        #overlay {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1.1rem; background: #101014; text-align: center; padding: 1.5rem;
            transition: opacity .4s ease;
        }
        #overlay h1 { font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: .01em; }
        #overlay .sub { font-size: .88rem; color: #8a8a96; max-width: 32rem; line-height: 1.5; }
        #bar { width: min(60vw, 320px); height: 6px; border-radius: 3px; background: #26262e; overflow: hidden; }
        #bar > div { height: 100%; width: 0%; background: linear-gradient(90deg,#4a9eff,#8ad0ff); transition: width .2s ease; }
        #status { font-size: .8rem; color: #6a6a76; min-height: 1em; }
        #startform {
            display: none; flex-direction: column; gap: .7rem; width: min(320px, 82vw);
            margin-top: .3rem;
        }
        #startform .field { display: flex; flex-direction: column; gap: .25rem; text-align: left; }
        #startform label { font-size: .74rem; color: #8a93a8; padding-left: 2px; }
        #startform input {
            font-size: 1rem; padding: .6rem .7rem; color: #e6ebf5;
            background: #16181f; border: 1px solid #2e2e3a; border-radius: 9px; outline: none;
        }
        #startform input:focus { border-color: #2b6fd6; background: #191c25; }
        #startform input.bad { border-color: #d05050; }
        #startbtn {
            margin-top: .3rem; padding: .75rem 1rem; font-size: 1.02rem; font-weight: 700;
            color: #fff; background: #2b6fd6; border: none; border-radius: 9px; cursor: pointer;
        }
        #startbtn:hover { background: #3b81ea; }
        #startform .note { font-size: .72rem; color: #6a7285; line-height: 1.5; }

        /* ── 실시간 순위판 패널 (게임 화면 위에 오버레이) ── */
        #lb {
            position: fixed; z-index: 8;
            top: calc(8px + env(safe-area-inset-top, 0px));
            right: calc(8px + env(safe-area-inset-right, 0px));
            width: min(240px, 54vw);
            background: rgba(14,16,24,.82); border: 1px solid #2b6fd6; border-radius: 12px;
            overflow: hidden; font-size: .74rem; box-shadow: 0 6px 24px rgba(0,0,0,.45);
        }
        #lb.collapsed #lbbody { display: none; }
        #lbhead {
            display: flex; align-items: center; gap: 6px; padding: 7px 10px;
            background: rgba(43,111,214,.18); cursor: pointer; user-select: none;
        }
        #lbhead .t { font-weight: 700; color: #cfe0ff; }
        #lbhead .dot { width: 8px; height: 8px; border-radius: 50%; background: #d05050; flex: 0 0 auto; transition: background .3s; }
        #lbhead .dot.on { background: #46c46a; }
        #lbhead .dot.wait { background: #d0a050; }
        #lbhead .room { flex: 1; color: #8a93a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #lbhead a { color: #8ad0ff; text-decoration: none; padding: 0 2px; }
        #lbhead .tog { color: #8a93a8; font-weight: 700; width: 1.1em; text-align: center; }
        #lbbody { max-height: 46vh; overflow-y: auto; padding: 4px 8px 8px; }
        #lb .sec { color: #7a8296; font-size: .64rem; margin: 7px 2px 3px; letter-spacing: .05em; }
        #lb ol { list-style: none; margin: 0; padding: 0; }
        #lb li { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 7px; font-variant-numeric: tabular-nums; }
        #lb li .r { width: 1.5em; text-align: center; color: #7a8296; font-weight: 700; }
        #lb li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
        #lb li .s { font-weight: 700; color: #e6ebf5; }
        #lb .alltime li:nth-child(1) .r { color: #ffce50; }
        #lb .alltime li:nth-child(2) .r { color: #cfd6e6; }
        #lb .alltime li:nth-child(3) .r { color: #d8895a; }
        #lb .live li { background: rgba(43,111,214,.10); }
        #lb .live .s { color: #8ad0ff; }
        #lb li.self { outline: 1px solid #2b6fd6; }
        #lb .empty { color: #5c6478; padding: 2px 6px 4px; }

        /* ── 온스크린 컨트롤 (데스크톱·모바일 공통, 항상 표시) ── */
        #controls {
            display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
            flex-direction: column; gap: 8px;
            padding: 8px calc(8px + env(safe-area-inset-right, 0px))
                     calc(8px + env(safe-area-inset-bottom, 0px))
                     calc(8px + env(safe-area-inset-left, 0px));
            background: rgba(16,16,20,.92); border-top: 1px solid #26262e;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        #controls .ctl-row { display: flex; gap: 8px; }
        #controls .ctl-top { justify-content: center; }
        #controls .btn {
            flex: 1 1 0; min-height: 44px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font: 600 .82rem/1.15 system-ui, sans-serif; color: #d0d0d8; text-align: center;
            background: #1c1c24; border: 1px solid #2e2e3a; border-radius: 10px;
            padding: 6px 4px; cursor: pointer;
            touch-action: none; -webkit-tap-highlight-color: transparent;
        }
        #controls .ctl-main .btn { min-height: 86px; font-size: .92rem; }
        #controls .btn.flip   { flex-grow: 2; background: #21324a; border-color: #2b6fd6; }
        #controls .btn.launch { background: #24303c; }
        #controls .btn small  { font-weight: 400; font-size: .64rem; color: #8a8a96; margin-top: 3px; }
        #controls .btn.active { background: #2b6fd6; border-color: #4a9eff; color: #fff; }
        #controls .btn.active small { color: #dbe9ff; }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <!-- 진입 화면: 로딩이 끝나면 닉네임/방 입력 폼이 나타난다 -->
    <div id="overlay">
        <h1>🕹️ 3D Pinball · Space Cadet</h1>
        <div class="sub">같은 방 사람들과 실시간으로 점수를 겨루는 경쟁 모드.</div>
        <div id="bar"><div></div></div>
        <div id="status">준비 중…</div>
        <form id="startform" autocomplete="off">
            <div class="field">
                <label for="nickin">닉네임</label>
                <input id="nickin" maxlength="24" placeholder="예: 철수" />
            </div>
            <div class="field">
                <label for="roomin">방 이름</label>
                <input id="roomin" maxlength="60" placeholder="pinball" />
            </div>
            <button id="startbtn" type="submit">▶ 시작</button>
            <div class="note">같은 방 이름을 쓰면 함께 순위를 겨뤄요. 순위판은 화면 우측 상단에 실시간으로 뜹니다.</div>
        </form>
    </div>

    <!-- 실시간 순위판: 게임 화면 위 우측 상단 오버레이 -->
    <div id="lb" aria-label="실시간 순위판">
        <div id="lbhead">
            <span class="t">🏆</span>
            <span class="dot" id="lbdot" title="서버 연결 상태"></span>
            <span class="room" id="lbroom"></span>
            <a id="lbfull" target="_blank" rel="noopener" title="전체화면 순위판">↗</a>
            <span class="tog" id="lbtog">–</span>
        </div>
        <div id="lbbody">
            <div class="sec">역대 순위</div>
            <ol class="alltime" id="lballtime"></ol>
            <div class="empty" id="lballtimeEmpty">아직 기록 없음</div>
            <div class="sec">지금 플레이 중</div>
            <ol class="live" id="lblive"></ol>
            <div class="empty" id="lbliveEmpty">아무도 없음</div>
        </div>
    </div>

    <!-- 온스크린 컨트롤: 각 버튼은 게임이 듣는 키의 DOM code 를 합성 KeyboardEvent 로 발생시킨다. -->
    <div id="controls" aria-label="게임 컨트롤">
        <div class="ctl-row ctl-top">
            <button class="btn hold" data-code="KeyX"    data-key="x"       data-kc="88">◀ 틸트<small>X</small></button>
            <button class="btn hold" data-code="ArrowUp" data-key="ArrowUp" data-kc="38">▲ 틸트<small>↑</small></button>
            <button class="btn hold" data-code="Period"  data-key="."       data-kc="190">틸트 ▶<small>.</small></button>
            <button class="btn tap"  data-code="F2"      data-key="F2"      data-kc="113">새 게임<small>F2</small></button>
        </div>
        <div class="ctl-row ctl-main">
            <button class="btn hold flip"   data-code="KeyZ"  data-key="z" data-kc="90">◀ 왼쪽 플리퍼<small>Z</small></button>
            <button class="btn hold launch" data-code="Space" data-key=" " data-kc="32">발사<small>Space · 누르고 떼기</small></button>
            <button class="btn hold flip"   data-code="Slash" data-key="/" data-kc="191">오른쪽 플리퍼 ▶<small>/</small></button>
        </div>
    </div>

    <script>
        (function () {
            var overlay = document.getElementById('overlay');
            var bar = document.querySelector('#bar > div');
            var statusEl = document.getElementById('status');
            var startForm = document.getElementById('startform');
            var nickIn = document.getElementById('nickin');
            var roomIn = document.getElementById('roomin');
            var canvas = document.getElementById('canvas');
            var ready = false;

            // ── 경쟁 모드 상태 ──
            var started = false, nick = null, room = 'pinball', ws = null, wsReady = false;
            var lastSent = -1, wasGameover = false, wsState = 'idle';
            var allTime = [];   // [{nick,score,time}] 역대 순위(서버가 정렬)
            var live = {};      // nick -> {score, ts} 지금 플레이 중
            var LIVE_TTL = 20000;

            // SDL(emscripten)은 window 에서 키보드를 가로채 preventDefault 하므로, 게임 시작 전(진입 폼)엔
            // 물리 키가 SDL 로 못 가게 막아야 닉네임/방 입력창에 타이핑이 된다. capture 단계 + emscripten
            // 로더(<script src>)보다 먼저 등록해야 SDL 리스너보다 앞서 실행된다. stopImmediatePropagation
            // 은 리스너 전파만 끊고 기본 동작(글자 입력)은 안 막으므로 입력창은 정상 동작한다.
            ['keydown', 'keyup', 'keypress'].forEach(function (t) {
                window.addEventListener(t, function (e) { if (!started) e.stopImmediatePropagation(); }, true);
            });

            // 제어문자 제거 + 60자 제한. 정규식의 \xNN 이스케이프는 셸 HTML 미니파이어가 깨뜨리므로
            // charCode 로 직접 필터링한다(미니파이 안전).
            function cleanRoom(s) {
                s = s || 'pinball';
                var out = '';
                for (var i = 0; i < s.length && out.length < 60; i++) {
                    var c = s.charCodeAt(i);
                    if (c >= 0x20 && c !== 0x7f) out += s.charAt(i);
                }
                return out || 'pinball';
            }

            function setProgress(p) { bar.style.width = Math.max(0, Math.min(100, p)) + '%'; }
            function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
            function fmt(n) { try { return Number(n).toLocaleString(); } catch (_) { return String(n); } }

            // ── 진입 폼 → 게임 시작 ──
            function startGame(ev) {
                if (ev) ev.preventDefault();
                var n = (nickIn.value || '').trim().slice(0, 24);
                if (!n) { nickIn.classList.add('bad'); nickIn.focus(); return; }
                nick = n;
                room = cleanRoom(roomIn.value);
                try { localStorage.setItem('scp_nick', nick); localStorage.setItem('scp_room', room); } catch (_) {}

                overlay.style.opacity = '0';
                setTimeout(function () { overlay.style.display = 'none'; }, 400);
                canvas.focus();
                // 브라우저는 오디오를 사용자 제스처 뒤로 미룬다 — 정지된 컨텍스트를 재개.
                try {
                    if (window.Module && Module.SDL2 && Module.SDL2.audioContext) Module.SDL2.audioContext.resume();
                } catch (_) {}

                started = true;
                syncPanelHead();
                connectWS();
            }
            startForm.addEventListener('submit', startGame);
            nickIn.addEventListener('input', function () { nickIn.classList.remove('bad'); });

            // ── 순위판 패널 ──
            var lb = document.getElementById('lb');
            document.getElementById('lbhead').addEventListener('click', function (e) {
                if (e.target && e.target.id === 'lbfull') return; // 링크 클릭은 통과
                lb.classList.toggle('collapsed');
                document.getElementById('lbtog').textContent = lb.classList.contains('collapsed') ? '+' : '–';
            });
            function syncPanelHead() {
                document.getElementById('lbroom').textContent = room;
                document.getElementById('lbfull').href = 'board.html?room=' + encodeURIComponent(room);
            }
            function setConn(s) {
                wsState = s;
                var d = document.getElementById('lbdot');
                if (d) d.className = 'dot' + (s === 'open' ? ' on' : s === 'connecting' ? ' wait' : '');
                renderAllTime(); renderLive(); // 빈 상태 문구를 연결 상태에 맞게 갱신
            }
            function emptyMsg(normal) { return wsState === 'open' ? normal : '⚠ 서버 미연결'; }

            function renderAllTime() {
                var list = allTime.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, 6);
                var em = document.getElementById('lballtimeEmpty');
                em.textContent = emptyMsg('아직 기록 없음');
                em.style.display = list.length ? 'none' : '';
                document.getElementById('lballtime').innerHTML = list.map(function (e, i) {
                    var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
                    var self = e.nick === nick ? ' self' : '';
                    return '<li class="' + (self ? 'self' : '') + '"><span class="r">' + medal + '</span>' +
                        '<span class="n">' + esc(e.nick) + '</span><span class="s">' + fmt(e.score) + '</span></li>';
                }).join('');
            }
            function renderLive() {
                var now = nowMs();
                var arr = Object.keys(live).map(function (n) { return { nick: n, score: live[n].score, ts: live[n].ts }; })
                    .filter(function (e) { return now - e.ts < LIVE_TTL; })
                    .sort(function (a, b) { return b.score - a.score; }).slice(0, 4);
                var em = document.getElementById('lbliveEmpty');
                em.textContent = emptyMsg('아무도 없음');
                em.style.display = arr.length ? 'none' : '';
                document.getElementById('lblive').innerHTML = arr.map(function (e) {
                    var self = e.nick === nick ? ' self' : '';
                    return '<li class="' + (self ? 'self' : '') + '"><span class="r">▸</span>' +
                        '<span class="n">' + esc(e.nick) + '</span><span class="s">' + fmt(e.score) + '</span></li>';
                }).join('');
            }
            function nowMs() { return (new Date()).getTime(); }
            setInterval(function () {
                var now = nowMs(), changed = false;
                for (var n in live) { if (now - live[n].ts >= LIVE_TTL) { delete live[n]; changed = true; } }
                if (changed) renderLive();
            }, 5000);

            // ── WebSocket: 점수 송신 + 순위판 수신 ──
            function connectWS() {
                if (ws || !nick) return;
                var proto = location.protocol === 'https:' ? 'wss' : 'ws';
                var url = proto + '://' + location.host + '/_ws?room=' + encodeURIComponent(room) + '&nick=' + encodeURIComponent(nick);
                console.log('[scp] connecting', url);
                setConn('connecting');
                try { ws = new WebSocket(url); } catch (_) { ws = null; setConn('closed'); return; }
                ws.onopen = function () { wsReady = true; setConn('open'); console.log('[scp] ws open'); };
                ws.onclose = function () { wsReady = false; ws = null; setConn('closed'); console.warn('[scp] ws closed → 재연결'); setTimeout(connectWS, 3000); };
                ws.onerror = function () { console.warn('[scp] ws error'); try { ws.close(); } catch (_) {} };
                ws.onmessage = function (ev) {
                    var m; try { m = JSON.parse(ev.data); } catch (_) { return; }
                    if (m.type === 'board') { allTime = m.entries || []; renderAllTime(); }
                    else if (m.type === 'score') {
                        if (m.final) { delete live[m.nick]; }
                        else { live[m.nick] = { score: m.score || 0, ts: nowMs() }; }
                        renderLive();
                    }
                };
            }
            function sendScore(score, final) {
                if (!wsReady || !ws) return;
                try { ws.send(JSON.stringify({ type: 'score', score: Math.round(score), final: !!final })); } catch (_) {}
            }

            // 게임의 하이스코어 등록(OK/Enter) 시 C++(high_score.cpp)가 호출 —
            // 등록한 점수를 리더보드 최종 점수로 확정 전송한다.
            window.scpReportFinal = function (score) { lastSent = -1; sendScore(score, true); };

            // 게임 점수/게임오버를 폴링. 값이 바뀌면 live, InGame→GameOver 전이 때 final 1회 전송.
            setInterval(function () {
                if (!ready || !started || !window.Module || !Module.ccall) return;
                var s = Module.ccall('scp_score', 'number', [], []);
                if (s < 0) return; // MainTable 아직 없음
                var go = Module.ccall('scp_is_gameover', 'number', [], []);
                if (go) {
                    if (!wasGameover) { wasGameover = true; sendScore(s, true); }
                } else {
                    if (wasGameover) { wasGameover = false; lastSent = -1; } // 새 게임 시작
                    if (s !== lastSent) { lastSent = s; sendScore(s, false); }
                }
            }, 700);

            // ── 온스크린 컨트롤 ──
            // SDL2(emscripten)는 window 의 keydown/keyup 을 듣고 DOM code 로 스캔코드를 매핑한다.
            function dispatchKey(type, code, key, kc) {
                var e = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true, view: window });
                try { // keyCode/which 는 생성자 초기화로 안 잡혀서 직접 정의 (레거시 경로 대비)
                    Object.defineProperty(e, 'keyCode', { get: function () { return kc; } });
                    Object.defineProperty(e, 'which',   { get: function () { return kc; } });
                } catch (_) {}
                window.dispatchEvent(e);
            }
            Array.prototype.forEach.call(document.querySelectorAll('#controls .btn'), function (btn) {
                var code = btn.dataset.code, key = btn.dataset.key, kc = parseInt(btn.dataset.kc, 10);
                var hold = btn.classList.contains('hold');
                function press(ev) {
                    ev.preventDefault();
                    if (btn.classList.contains('active')) return;
                    btn.classList.add('active');
                    // 포인터 캡처: 손가락이 버튼 밖으로 미끄러져도 pointerup 을 이 버튼이 받는다(키 안 물림).
                    try { btn.setPointerCapture(ev.pointerId); } catch (_) {}
                    dispatchKey('keydown', code, key, kc);
                    if (!hold) { dispatchKey('keyup', code, key, kc); setTimeout(function () { btn.classList.remove('active'); }, 100); }
                }
                function release() {
                    if (!hold || !btn.classList.contains('active')) return;
                    btn.classList.remove('active');
                    dispatchKey('keyup', code, key, kc);
                }
                btn.addEventListener('pointerdown', press);
                btn.addEventListener('pointerup', release);
                btn.addEventListener('pointercancel', release);
                btn.addEventListener('lostpointercapture', release);
            });
            function releaseAll() {
                Array.prototype.forEach.call(document.querySelectorAll('#controls .btn.active'), function (btn) {
                    btn.classList.remove('active');
                    dispatchKey('keyup', btn.dataset.code, btn.dataset.key, parseInt(btn.dataset.kc, 10));
                });
            }
            window.addEventListener('blur', releaseAll);
            document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });

            // 진입 폼 초기값: 닉네임(localStorage), 방(?room=)
            try { nickIn.value = localStorage.getItem('scp_nick') || ''; } catch (_) {}
            try { roomIn.value = cleanRoom((new URLSearchParams(location.search)).get('room')); } catch (_) { roomIn.value = 'pinball'; }
            syncPanelHead();

            // Emscripten reads this global before the generated loader runs.
            window.Module = {
                canvas: canvas,
                print: function (t) { console.log(t); },
                printErr: function (t) { console.warn(t); },
                setStatus: function (text) {
                    if (ready) return;
                    var m = text && text.match(/([\d.]+)\/([\d.]+)/);
                    if (m) { setProgress(100 * parseFloat(m[1]) / parseFloat(m[2])); statusEl.textContent = '게임 데이터 받는 중…'; }
                    else if (text) { statusEl.textContent = text; }
                },
                onRuntimeInitialized: function () {
                    ready = true;
                    setProgress(100);
                    statusEl.textContent = '';
                    canvas.addEventListener('pointerdown', function () { canvas.focus(); });
                    // 언어 변경으로 리로드된 경우: 폼을 건너뛰고 저장된 닉/방으로 자동 재개.
                    var auto = false;
                    try { auto = localStorage.getItem('scp_autostart') === '1'; if (auto) localStorage.removeItem('scp_autostart'); } catch (_) {}
                    if (auto && (nickIn.value || '').trim()) {
                        try { var sr = localStorage.getItem('scp_room'); if (sr) roomIn.value = sr; } catch (_) {}
                        startGame();
                    } else {
                        startForm.style.display = 'flex';
                        nickIn.focus();
                    }
                }
            };
            window.onerror = function (msg) { statusEl.textContent = 'error: ' + msg; };
        })();
    </script>
    {{{ SCRIPT }}}
