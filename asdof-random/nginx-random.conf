# asdof-random — nginx vhost (random.asdof.xyz)
#
# 앱(systemd: asdof-random)이 127.0.0.1:8770 에서 정적 파일과 WebSocket 을 모두 서빙하므로
# nginx 는 단순 프록시 + WebSocket 업그레이드만 해주면 된다.
#
# 배치:
#   sudo cp nginx-random.conf /etc/nginx/sites-available/random.conf
#   sudo ln -s /etc/nginx/sites-available/random.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d random.asdof.xyz     # 443/TLS 는 certbot 이 추가
#
# 전제: DNS 에 random.asdof.xyz A레코드가 서버(161.118.133.112)를 가리켜야 함.

server {
    listen 80;
    listen [::]:80;
    server_name random.asdof.xyz;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 업그레이드 (/_ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 방에 오래 머무는 연결이 끊기지 않도록 (앱이 45초마다 ping 하지만 여유를 둔다)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
