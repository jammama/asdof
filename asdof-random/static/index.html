<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랜덤 팀뽑기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2310131a%22/%3E%3Crect%20x%3D%2213%22%20y%3D%2219%22%20width%3D%2224%22%20height%3D%2232%22%20rx%3D%225%22%20fill%3D%22%236ea8ff%22%20transform%3D%22rotate%28-15%2025%2035%29%22/%3E%3Crect%20x%3D%2227%22%20y%3D%2216%22%20width%3D%2224%22%20height%3D%2232%22%20rx%3D%225%22%20fill%3D%22%23ffd452%22%20transform%3D%22rotate%2813%2039%2032%29%22/%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2231%22%20r%3D%224.5%22%20fill%3D%22%2310131a%22/%3E%3C/svg%3E">
<meta name="description" content="랜덤 팀뽑기 — 링크만 열면 누구나 같은 결과를 볼 수 있어요">
<meta name="theme-color" content="#10131a">
<style>
:root{
  --bg:#10131a; --panel:#181c26; --panel2:#1f2431; --line:#2a3040;
  --fg:#e7ecf5; --muted:#8b95ab; --gold:#ffd452; --blue:#6ea8ff; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1b2130 0%,var(--bg) 60%) no-repeat,var(--bg);
  color:var(--fg); min-height:100vh;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
textarea{font:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){background:#283044;border-color:#3a4356}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(180deg,#ffe07a,#f5bf2b);color:#2a1f00;border-color:#e0ad1c}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.inp{background:#121620;border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 13px;outline:none}
.inp:focus{border-color:#4a5670}
textarea.inp{width:100%;resize:vertical;line-height:1.6;font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:9px}
.hidden{display:none !important}

header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px}
.logo b{color:var(--gold)}
.roompill{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#4bd07a;flex:none}
.dot.off{background:#e0574c}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:700}

/* ── 제비 카드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.slip{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border-radius:10px;padding:4px 2px;transition:.15s}
.slip:hover{background:#1e2431}
.slip .who{font-size:12.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slip.me{background:rgba(110,168,255,.12);box-shadow:0 0 0 1px rgba(110,168,255,.4) inset}
.slip.me .who{color:var(--blue)}
.tile{width:100%;aspect-ratio:1.3;perspective:600px}
.tile .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.slip.open .tile .in{transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;border:1px solid var(--line)}
.tile .f{background:repeating-linear-gradient(135deg,#1e2430,#1e2430 6px,#222a38 6px,#222a38 12px);color:#5c6680;font-size:19px}
.tile .b{transform:rotateY(180deg);font-size:21px;background:#202634;color:var(--muted)}

/* ── 항목/결과 목록 ── */
.plist{display:flex;flex-direction:column;gap:7px}
.pitem{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.45}
.num{flex:none;width:21px;height:21px;border-radius:6px;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pitem .pn{font-weight:600;flex:1;min-width:0;word-break:break-word}
.pitem .ps{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;margin-top:2px}
.pitem .who{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.pitem .who b{color:var(--blue)}
.pitem.mine{background:rgba(110,168,255,.09);border-radius:9px;padding:5px 7px;margin:-5px -7px}

.banner{margin-bottom:14px;border-radius:var(--radius);padding:14px 16px;font-weight:800;font-size:16px;
  background:linear-gradient(100deg,rgba(255,212,82,.16),rgba(255,212,82,.04));
  border:1px solid rgba(255,212,82,.35);color:var(--gold);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.lose{background:var(--panel);border-color:var(--line);color:var(--muted)}
.banner .sub{font-size:13px;font-weight:600;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#0b0e14;
  border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:600;
  pointer-events:none;transition:.25s;max-width:88vw;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ── 방 만들기 화면 ── */
.gate{max-width:440px;margin:14vh auto 0;padding:0 18px;text-align:center}
.gtitle{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:22px}
.gtitle b{color:var(--gold)}
.gate p{color:var(--fg);font-size:15px;font-weight:600;margin:0 0 12px}
.gate .row{gap:8px}
.gate .inp{flex:1;text-align:center;font-weight:700}
.gate .note{text-align:left}
.logo b{cursor:pointer}

@media (max-width:520px){ .wrap{padding:14px 12px 50px} .gate{margin-top:8vh} }
</style>
</head>
<body>

<!-- ══════ 방 만들기 (기본 도메인 화면) ══════ -->
<div id="gate" class="gate hidden">
  <div class="gtitle">🎟 <b>랜덤 팀뽑기</b></div>
  <p>방 이름을 정해주세요</p>
  <div class="row">
    <input id="gateName" class="inp" maxlength="30" autocomplete="off" value="랜덤 팀뽑기">
    <button id="gateGo" class="btn primary">방 만들기</button>
  </div>
  <div class="note">방을 만들면 고유 주소가 생겨요. 그 링크를 공유하면 다 같이 같은 결과를 봅니다.</div>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div class="logo">🎟 <b id="roomTitle">랜덤 팀뽑기</b></div>
    <div class="roompill">
      <span id="connDot" class="dot off"></span>
      <span id="viewers">0명 보는 중</span>
      <button id="copyBtn" class="btn sm ghost" title="링크 복사">링크</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <div class="card">
    <h2>멤버 <span id="mcount"></span></h2>
    <div id="grid" class="grid"></div>
    <div id="hint" class="note">이름을 누르면 「나」로 표시돼요(이 브라우저에만 저장).</div>
    <details id="memEdit" style="margin-top:12px">
      <summary class="lbl" style="cursor:pointer">명단 수정</summary>
      <textarea id="memInp" class="inp" rows="7" spellcheck="false" style="margin-top:9px"
        placeholder="한 줄에 한 명"></textarea>
      <div class="row" style="margin-top:9px">
        <button id="memApply" class="btn sm">명단 적용</button>
        <span class="lbl" id="memHint"></span>
        <button id="memReload" class="btn sm ghost" style="margin-left:auto">기본값 되돌리기</button>
      </div>
      <div class="note">뽑기 전에만 바꿀 수 있어요. 바꾸면 모두의 화면에 바로 반영됩니다.</div>
    </details>
  </div>

  <div class="card">
    <h2>뽑기 항목 <span id="seatSum"></span></h2>
    <div id="poolList" class="plist"></div>
    <div style="margin-top:12px">
      <textarea id="poolInp" class="inp" rows="6" spellcheck="false"
        placeholder="한 줄에 하나씩 — 예) 프랭크의 골동품가게 [공포] 3인"></textarea>
      <div class="row" style="margin-top:9px">
        <button id="applyBtn" class="btn sm">항목 적용</button>
        <span class="lbl" id="parseHint"></span>
        <button id="drawBtn" class="btn primary" style="margin-left:auto">제비 뽑기</button>
        <button id="resetBtn" class="btn hidden" style="margin-left:auto">다시 뽑기</button>
      </div>
    </div>
    <div id="setNote" class="note"></div>
  </div>

  <div id="resultCard" class="card hidden">
    <h2>배정 결과 <span id="drawTime" class="lbl"></span></h2>
    <div id="groups" class="plist"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

const GCOLORS = ['#ffd452','#6ee7a8','#7cc4ff','#c9a3ff','#ff9ec4','#ffb26e','#a8e05f','#5ad3b5',
                 '#e58cff','#f0d060','#8ce0ff','#ffa0a0'];
const gColorOf = i => i < 0 ? '#6d7793' : GCOLORS[i % GCOLORS.length];

let toastTimer = 0;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

// 경로가 곧 판의 키. 경로가 없으면(기본 도메인) 방 만들기 화면을 띄운다.
const room = decodeURIComponent(location.pathname.replace(/^\/+/,'').replace(/\/+$/,''));

if (!room) {
  $('gate').classList.remove('hidden');
  const inp = $('gateName');
  const go = () => {
    const name = inp.value.trim() || '랜덤 팀뽑기';
    // 무작위 10글자 키 = 방 주소. 헷갈리는 글자(l,o,0,1)는 뺀다.
    const cs = 'abcdefghijkmnpqrstuvwxyz23456789';
    const buf = new Uint8Array(10); crypto.getRandomValues(buf);
    let key = ''; for (const b of buf) key += cs[b % cs.length];
    location.href = '/' + key + '?name=' + encodeURIComponent(name);
  };
  $('gateGo').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
  return;
}

$('app').classList.remove('hidden');

// 방을 갓 만들었다면 ?name= 으로 이름이 넘어온다 → 서버에 등록하고 주소는 깔끔하게 정리.
const pendingTitle = new URLSearchParams(location.search).get('name');
if (pendingTitle) history.replaceState(null, '', location.pathname);

// 내 이름(이 브라우저에만 저장) — 결과에서 내 줄을 강조하는 용도
let me = localStorage.getItem('asdof-random:me') || '';

// ── 항목 텍스트 파싱: 줄 끝의 "3인" / "x3" / "(3)" 을 인원으로 (없으면 1명) ──
function parsePool(text){
  const out = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    let name = line, seats = 1;
    const m = line.match(/^(.*?)[\s,·|]*(?:(\d{1,2})\s*(?:인|명)|[x*×]\s*(\d{1,2})|\((\d{1,2})\))$/);
    if (m && m[1].trim()) { name = m[1].trim(); seats = Math.max(1, Math.min(60, +(m[2]||m[3]||m[4]))); }
    out.push({ name: name.slice(0,70), seats });
    if (out.length >= 12) break;
  }
  return out;
}
const poolText = pool => pool.map(p => `${p.name} ${p.seats}인`).join('\n');
const seatsOf  = pool => pool.reduce((a,p) => a + p.seats, 0);

// ── 상태 ──
let S = null;
let round = -1;
let open = new Set();
let timers = [];
const STEP = 150;                       // 제비 한 장씩 열리는 간격(ms)
const totalOf = n => n * STEP + 300;

// ── WebSocket ──
let ws = null, retry = 0, retryTimer = 0;
function connect(){
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/_ws?room=' + encodeURIComponent(room));
  ws.onopen = () => { retry = 0; $('connDot').classList.remove('off'); };
  ws.onclose = () => {
    $('connDot').classList.add('off');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, Math.min(8000, 400 * Math.pow(1.7, retry++)));
  };
  ws.onerror = () => {};
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'notice') { toast(m.text); return; }
    if (m.type === 'state') apply(m);
  };
}
const send = o => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(o)); };

let titleSent = false;
function apply(s){
  const first = !S;
  S = s;
  if (pendingTitle && !titleSent) { titleSent = true; send({ type: 'title', title: pendingTitle }); }
  if (s.draw) {
    if (round !== s.round) { round = s.round; startReveal(s.elapsed || 0); }
  } else {
    round = -1; clearTimers(); open = new Set();
  }
  // 편집 중인 칸은 서버 값으로 덮어쓰지 않는다.
  if (document.activeElement !== $('poolInp')) $('poolInp').value = poolText(s.pool);
  if (document.activeElement !== $('memInp')) $('memInp').value = s.members.join('\n');
  render();
}

function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function startReveal(elapsed){
  clearTimers();
  open = new Set();
  const n = S.members.length;
  for (let i = 0; i < n; i++) {
    const at = i * STEP;
    if (elapsed >= at) { open.add(i); continue; }
    timers.push(setTimeout(() => { open.add(i); render(); }, at - elapsed));
  }
  if (elapsed < totalOf(n)) timers.push(setTimeout(render, totalOf(n) - elapsed));
}

const revealDone = () => !!(S.draw && open.size >= S.members.length);

function render(){
  const s = S; if (!s) return;
  const n = s.members.length;
  const drawn = !!s.draw;

  const title = s.title || '랜덤 팀뽑기';
  $('roomTitle').textContent = title;
  $('roomTitle').title = '눌러서 방 이름 바꾸기';
  document.title = title === '랜덤 팀뽑기' ? title : title + ' — 랜덤 팀뽑기';
  $('viewers').textContent = s.viewers + '명 보는 중';
  $('mcount').textContent = n ? n + '명' : '(명단 없음)';

  // 제비 카드
  const grid = $('grid');
  grid.innerHTML = '';
  s.members.forEach((name, i) => {
    const g = drawn ? s.draw[i] : -2;
    const el = document.createElement('div');
    el.className = 'slip' + (name === me ? ' me' : '') + (open.has(i) ? ' open' : '');
    const who = document.createElement('div');
    who.className = 'who'; who.textContent = name; who.title = name;
    const tile = document.createElement('div'); tile.className = 'tile';
    const inner = document.createElement('div'); inner.className = 'in';
    const f = document.createElement('div'); f.className = 'f'; f.textContent = '?';
    const b = document.createElement('div'); b.className = 'b';
    if (g >= 0) {
      b.textContent = g + 1;
      b.style.color = gColorOf(g); b.style.background = gColorOf(g) + '24'; b.style.borderColor = gColorOf(g) + '80';
    } else if (g === -1) { b.textContent = '꽝'; b.style.fontSize = '15px'; }
    inner.append(f, b); tile.appendChild(inner);
    el.append(who, tile);
    el.onclick = () => {
      me = (me === name) ? '' : name;
      localStorage.setItem('asdof-random:me', me);
      render();
    };
    grid.appendChild(el);
  });

  // 명단 편집
  $('memEdit').classList.toggle('hidden', drawn);
  $('memInp').disabled = drawn;
  $('memApply').disabled = drawn;
  $('memReload').classList.toggle('hidden', !s.custom);

  // 항목
  const seats = seatsOf(s.pool);
  $('seatSum').textContent = `· 총 ${seats}자리 / 멤버 ${n}명`;
  $('poolInp').classList.toggle('hidden', drawn);
  $('applyBtn').classList.toggle('hidden', drawn);
  $('parseHint').classList.toggle('hidden', drawn);
  $('drawBtn').classList.toggle('hidden', drawn);
  $('resetBtn').classList.toggle('hidden', !drawn);
  $('drawBtn').disabled = n < 2;

  let note = '';
  if (drawn) note = '결과가 서버에 저장돼 있어요 — 링크만 열면 누구나 이 결과를 봅니다. 「다시 뽑기」를 누르면 지워지고 새로 뽑습니다.';
  else if (n < 2) note = '명단을 불러오지 못했어요.';
  else if (seats > n) note = `자리가 ${seats - n}개 남아요 — 남는 자리는 무작위로 빠집니다(멤버 ${n}명에 맞춤).`;
  else if (seats < n) note = `자리보다 ${n - seats}명 많아요 — ${n - seats}명은 꽝이 됩니다.`;
  else note = '자리와 인원이 딱 맞아요 — 전원 배정됩니다.';
  $('setNote').textContent = note;

  poolList();
  banner();
}

function pitem(gi, name, right){
  const el = document.createElement('div');
  el.className = 'pitem';
  const num = document.createElement('span');
  num.className = 'num'; num.textContent = gi < 0 ? '–' : gi + 1;
  num.style.background = gColorOf(gi) + '22'; num.style.color = gColorOf(gi);
  const pn = document.createElement('span'); pn.className = 'pn'; pn.textContent = name;
  const ps = document.createElement('span'); ps.className = 'ps'; ps.textContent = right;
  el.append(num, pn, ps);
  return el;
}

// 멤버 이름 목록을 span 으로(내 이름은 강조)
function whoSpan(names){
  const who = document.createElement('span');
  who.className = 'who';
  if (!names.length) { who.textContent = '— 배정된 사람 없음'; return who; }
  names.forEach((nm, i) => {
    if (i) who.appendChild(document.createTextNode(', '));
    if (nm === me) { const b = document.createElement('b'); b.textContent = nm; who.appendChild(b); }
    else who.appendChild(document.createTextNode(nm));
  });
  return who;
}

function poolList(){
  const s = S;
  const list = $('poolList');
  list.innerHTML = '';
  s.pool.forEach((p, i) => list.appendChild(pitem(i, p.name, p.seats + '인')));

  const ready = revealDone();
  $('resultCard').classList.toggle('hidden', !ready);
  if (!ready) return;

  $('drawTime').textContent = s.drawnAt ? '· ' + new Date(s.drawnAt).toLocaleString('ko-KR', {
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

  const box = $('groups');
  box.innerHTML = '';
  s.pool.forEach((p, i) => {
    const mem = s.members.filter((_, k) => s.draw[k] === i);
    const el = pitem(i, p.name, `${mem.length}/${p.seats}명`);
    el.querySelector('.pn').appendChild(whoSpan(mem));
    if (me && mem.includes(me)) el.classList.add('mine');
    box.appendChild(el);
  });
  const blanks = s.members.filter((_, k) => s.draw[k] < 0);
  if (blanks.length) {
    const el = pitem(-1, '꽝 (배정 없음)', blanks.length + '명');
    el.querySelector('.pn').appendChild(whoSpan(blanks));
    if (me && blanks.includes(me)) el.classList.add('mine');
    box.appendChild(el);
  }
}

function banner(){
  const s = S, el = $('banner');
  if (!revealDone()) { el.classList.add('hidden'); return; }
  el.className = 'banner';
  el.style.borderColor = '';
  el.innerHTML = '';
  const main = document.createElement('span');
  const sub = document.createElement('span'); sub.className = 'sub';

  const idx = me ? s.members.indexOf(me) : -1;
  if (idx >= 0) {
    const g = s.draw[idx];
    if (g >= 0) {
      main.textContent = `🎟 ${me} → ${g + 1}번 · ${s.pool[g].name}`;
      main.style.color = gColorOf(g);
      el.style.borderColor = gColorOf(g) + '66';
    } else {
      el.className = 'banner lose';
      main.textContent = `😌 ${me} → 꽝 (배정된 자리 없음)`;
    }
  } else {
    main.textContent = '🎉 뽑기 완료 — 아래 명단을 확인하세요';
    sub.textContent = '내 이름을 누르면 내 결과가 위에 떠요';
  }
  el.append(main, sub);
  el.classList.remove('hidden');
}

// ── 입력 ──
const parseMembers = text => text.split('\n')
  .map(s => s.replace(/^[-*]\s*/, '').trim())
  .filter(s => s && !s.startsWith('#'))
  .map(s => s.slice(0, 20))
  .slice(0, 60);

$('memApply').onclick = () => {
  const mem = parseMembers($('memInp').value);
  if (mem.length < 2) { toast('명단은 두 명 이상이어야 해요'); return; }
  send({ type: 'config', members: mem });
  toast(`명단 ${mem.length}명으로 적용했어요`);
};
$('memInp').oninput = () => {
  const mem = parseMembers($('memInp').value);
  $('memHint').textContent = mem.length ? `${mem.length}명` : '';
};
$('memReload').onclick = () => {
  if (confirm('명단과 항목을 서버 기본값으로 되돌릴까요? 지금 내용은 사라집니다.')) send({ type: 'reload' });
};
$('applyBtn').onclick = () => {
  const pool = parsePool($('poolInp').value);
  if (!pool.length) { toast('항목을 한 줄에 하나씩 적어주세요'); return; }
  send({ type: 'config', pool });
  toast(`항목 ${pool.length}개 · 총 ${seatsOf(pool)}자리로 적용했어요`);
};
$('poolInp').oninput = () => {
  const pool = parsePool($('poolInp').value);
  $('parseHint').textContent = pool.length ? `${pool.length}개 · ${seatsOf(pool)}자리` : '';
};
$('drawBtn').onclick = () => {
  if (confirm('제비를 뽑습니다. 결과는 모두에게 공개되고 서버에 저장됩니다.')) send({ type: 'draw' });
};
$('resetBtn').onclick = () => {
  if (confirm('지금 결과를 지우고 다시 뽑을까요? 모두의 화면에서 사라집니다.')) send({ type: 'reset' });
};
$('roomTitle').onclick = () => {
  const v = (prompt('방 이름', S && S.title || '') || '').trim();
  if (v) send({ type: 'title', title: v.slice(0, 30) });
};
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); toast('링크를 복사했어요'); }
  catch { toast(location.href); }
};

connect();
})();
</script>
</body>
</html>
